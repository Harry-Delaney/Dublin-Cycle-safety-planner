services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cyclesafe_net

  web:
    build: .
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cyclesafe_net

  pgadmin:
    image: dpage/pgadmin4:8.12
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - cyclesafe_net

volumes:
  postgis_data:

networks:
  cyclesafe_net:
    driver: bridge
