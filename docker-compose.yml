services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    restart: unless-stopped
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cyclesafe_net

  web:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cyclesafe_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - cyclesafe_net

  pgadmin:
    image: dpage/pgadmin4:8.12
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - cyclesafe_net

volumes:
  postgis_data:
  static_volume:
  pgadmin_data:

networks:
  cyclesafe_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
